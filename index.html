<!DOCTYPE html>
<html>
<head>
  <title>WiFi Login</title>
</head>
<body>

<h2>Enter Voucher</h2>

<input id="voucher" placeholder="Voucher Code" />
<button onclick="login()">Connect</button>

<script>
async function login() {

    const voucherCode = document.getElementById("voucher").value;

    const urlParams = new URLSearchParams(window.location.search);

    const apMac = urlParams.get("apMac");
    const clientMac = urlParams.get("clientMac");

    const res = await fetch("http://127.0.0.1:8000/proxy/login/", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            apMac,
            clientMac,
            voucherCode
        })
    });

    const data = await res.json();

    console.log(data);

    if (data.success) {
        alert("Connected!");
        window.location.href = data.redirectUrl || "http://google.com";
    } else {
        alert("Invalid voucher");
    }
}
</script>

</body>
</html>
